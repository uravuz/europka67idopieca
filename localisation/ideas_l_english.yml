l_english:
  PZN_ideas: "Poznan Ideas"
  PZN_ideas_desc: "Poznan is a city in western Poland, known for its rich history and cultural heritage. The city has a long tradition of trade and commerce, and has been an important center of industry and education for centuries. Poznan is also known for its vibrant arts scene, with numerous theaters, galleries, and music venues. The city's strategic location on the Warta River has made it a key hub for transportation and logistics in the region. Overall, Poznan's ideas are shaped by its unique blend of history, culture, and economic significance."

  PZN_Poznanscy_kupcy: "Poznanscy Kupcy"
  PZN_Poznanscy_kupcy_desc: "The economic growth observed among Poznań merchants in recent years reflects a dynamic and steadily developing"

  PZN_Praca_u_podstaw: "Praca u Podstaw"
  PZN_Praca_u_podstaw_desc: "Praca u Podstaw has a significant impact on the satisfaction and well-being of residents. By focusing on improving basic living conditions"

  PZN_Rozbudowa_Poznania: "Rozbudowa Poznania"
  PZN_Rozbudowa_Poznania_desc: "the expansion is not only physical but also economic. New investments, public are often directed into rebuilding the city,"

  PZN_Degermanizacja: "Degermanizacja"
  PZN_Degermanizacja_desc: "The process of de-Germanization in Poznań had a significant impact on the city’s social, cultural, and economic development. After periods of foreign rule, efforts were made to restore Polish identity, language, and traditions in public life, education, and administration."

  PZN_Strzelcy_Wielkopolscy: "Strzelcy_Wielkopolscy"
  PZN_Strzelcy_Wielkopolscy_desc: "The Greater Poland Riflemen were regarded as outstanding soldiers, known for their discipline, determination, and strong sense of patriotism"

  PZN_Cytadela: "Cytadela"
  PZN_Cytadela_desc: "The Citadel was regarded as an almost indestructible fortress, symbolizing strength, resilience, and strategic power. Built with massive defensive walls"

  PZN_Staranna_Praca: "Staranna_Praca"
  PZN_Staranna_Praca_desc: "The people of Greater Poland are widely known for their diligence, precision, and strong work ethic. Their careful and well-organized approach to work has played a key role in the region’s economic and social development."

